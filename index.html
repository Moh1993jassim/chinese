<title>نظام محمد للصينية — COSL</title>
<style>
:root{
 --bg:#0d1420; --card:#161f2e; --card2:#1c2839; --line:#26364d; --line2:#33465f;
 --txt:#eaf1f8; --mut:#94a9c0; --gold:#f5c451; --blue:#5aa9e6; --green:#3ec98a;
 --red:#ff6b6b; --purple:#b07bff; --pink:#ff8fb1; --shadow:0 2px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:"Segoe UI",Tahoma,Arial,sans-serif;
 padding-bottom:78px;line-height:1.6;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

header{position:sticky;top:0;z-index:40;background:rgba(13,20,32,.97);backdrop-filter:blur(8px);
 border-bottom:1px solid var(--line);padding:9px 12px}
.hrow{display:flex;align-items:center;gap:9px;max-width:1180px;margin:0 auto}
.brand{font-size:15px;font-weight:800;color:var(--gold);white-space:nowrap}
.daychip{background:var(--card2);border:1px solid var(--line2);border-radius:999px;
 padding:4px 11px;font-size:12px;color:var(--mut);white-space:nowrap}
.daychip b{color:var(--gold)}
#q{flex:1;min-width:80px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);
 background:#0a1120;color:var(--txt);font-size:14px;outline:none}
#q:focus{border-color:var(--gold)}
@media(max-width:470px){.brand{display:none}}
@media(max-width:350px){.daychip{display:none}}
.gbar{height:5px;background:var(--card2);border-radius:99px;overflow:hidden;margin:8px auto 0;max-width:1180px}
.gbar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold));
 border-radius:99px;transition:width .5s}

nav{position:fixed;bottom:0;right:0;left:0;z-index:50;background:rgba(13,20,32,.98);
 backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:5px 2px 7px}
nav .inner{display:flex;gap:1px;overflow-x:auto;max-width:1180px;width:100%;scrollbar-width:none}
nav .inner::-webkit-scrollbar{display:none}
.nb{position:relative;flex:1 0 auto;min-width:60px;display:flex;flex-direction:column;
 align-items:center;gap:2px;padding:5px 6px;border-radius:11px;font-size:10.5px;color:var(--mut);transition:.15s}
.nb b{font-size:19px;line-height:1;font-weight:400}
.nb.on{color:var(--gold);background:var(--card2)}
.nb .dot{position:absolute;top:1px;right:calc(50% - 21px);background:var(--red);border-radius:99px;
 font-size:9px;padding:0 5px;color:#fff;font-weight:700;line-height:15px}

main{padding:13px 12px;max-width:1180px;margin:0 auto}
h2.sec{font-size:15px;font-weight:800;color:var(--gold);margin:17px 0 9px;padding-right:9px;border-right:4px solid var(--gold)}
h2.sec:first-child{margin-top:2px}
h3.sub2{font-size:13.5px;font-weight:700;color:var(--blue);margin:14px 0 7px}
.sub{font-size:12.5px;color:var(--mut);margin:-5px 0 10px}

.box{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:1040px){.grid{grid-template-columns:1fr 1fr 1fr}}

.item{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px 14px;
 position:relative;transition:.18s;box-shadow:var(--shadow)}
.item.done{border-color:rgba(62,201,138,.5);background:linear-gradient(180deg,rgba(62,201,138,.07),var(--card))}
.item .top{display:flex;align-items:flex-start;gap:10px}
.item .em{font-size:26px;line-height:1}
.item .hz{font-size:27px;font-weight:700;letter-spacing:1px;direction:ltr;text-align:left;line-height:1.35}
.item .py{font-size:13.5px;color:var(--gold);direction:ltr;text-align:left;margin-top:1px}
.item .ar{font-size:15px;margin-top:5px;font-weight:600}
.item .en{font-size:12px;color:var(--mut);direction:ltr;text-align:left}
.item .ex{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line2);font-size:13px}
.item .ex .exhz{font-size:18px;direction:ltr;text-align:left;font-weight:600}
.item .ex .expy{font-size:12px;color:var(--blue);direction:ltr;text-align:left}
.item .ex .exar{font-size:13px;color:var(--mut);margin-top:2px}
.item .nt{font-size:12px;color:var(--mut);margin-top:6px;line-height:1.55}
.acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:var(--card2);border-radius:9px;padding:6px 11px;
 font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:5px;transition:.15s}
.btn:hover{border-color:var(--gold);color:var(--txt)}
.btn.ok{background:rgba(62,201,138,.16);border-color:var(--green);color:var(--green);font-weight:700}
.btn.play{color:var(--blue)}
.badge{position:absolute;top:10px;left:12px;font-size:10.5px;color:var(--mut);background:var(--card2);
 border-radius:99px;padding:2px 8px;border:1px solid var(--line);max-width:52%;overflow:hidden;
 text-overflow:ellipsis;white-space:nowrap}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.ch{white-space:nowrap;padding:6px 13px;border-radius:999px;background:var(--card2);
 border:1px solid var(--line);font-size:12.5px;color:var(--mut);transition:.15s}
.ch.on{background:var(--gold);color:#12233b;font-weight:700;border-color:var(--gold)}
.ch small{opacity:.7;margin-right:4px}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:12px}
@media(min-width:560px){.stats{grid-template-columns:repeat(4,1fr)}}
.st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center}
.st b{display:block;font-size:23px;color:var(--gold);line-height:1.25}
.st span{font-size:11.5px;color:var(--mut)}
.st.g b{color:var(--green)}.st.b b{color:var(--blue)}.st.p b{color:var(--purple)}

.task{display:flex;align-items:center;gap:11px;padding:11px 12px;background:var(--card);
 border:1px solid var(--line);border-radius:13px;margin-bottom:8px;transition:.15s}
.task.done{border-color:rgba(62,201,138,.45);opacity:.72}
.task .cb{width:26px;height:26px;min-width:26px;border-radius:8px;border:2px solid var(--line2);
 display:flex;align-items:center;justify-content:center;font-size:15px;color:transparent;transition:.15s}
.task.done .cb{background:var(--green);border-color:var(--green);color:#0d1420}
.task .tx{flex:1;min-width:0}
.task .tx b{font-size:14px;display:block}
.task .tx span{font-size:12px;color:var(--mut)}
.task .dur{font-size:11.5px;color:var(--gold);background:var(--card2);border-radius:99px;
 padding:3px 9px;border:1px solid var(--line);white-space:nowrap}

/* ── درس اليوم ── */
.today{background:linear-gradient(150deg,#1b3a5e,#132437);border:1px solid var(--gold);
 border-radius:18px;padding:16px;margin-bottom:13px;box-shadow:var(--shadow)}
.today .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.today .hd b{font-size:17px;color:var(--gold)}
.today .hd span{font-size:11.5px;color:var(--mut);background:rgba(0,0,0,.28);
 border-radius:99px;padding:3px 10px}
.today .lesson{font-size:15px;font-weight:700;margin-bottom:3px}
.today .srcline{font-size:12.5px;color:var(--blue);margin-bottom:9px}
.rounds{display:grid;gap:7px;margin:9px 0}
@media(min-width:760px){.rounds{grid-template-columns:1fr 1fr 1fr}}
.rd{background:rgba(0,0,0,.24);border:1px solid var(--line2);border-radius:11px;padding:9px 11px}
.rd b{display:block;font-size:12px;color:var(--gold);margin-bottom:3px}
.rd span{font-size:12px;color:var(--txt);line-height:1.6}
.tw{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.tw i{font-style:normal;background:rgba(245,196,81,.14);border:1px solid rgba(245,196,81,.35);
 border-radius:8px;padding:4px 9px;font-size:12.5px;color:var(--gold);direction:ltr}
.goal{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line2)}
.goal b{font-size:11.5px;color:var(--mut);display:block}
.goal span{font-size:13.5px;font-weight:600}

/* ── شبكة الكلمات ── */
.net{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;
 margin-bottom:12px;box-shadow:var(--shadow)}
.net.done{border-color:rgba(62,201,138,.45)}
.nethd{display:flex;align-items:center;gap:12px;margin-bottom:11px;flex-wrap:wrap}
.core{width:66px;height:66px;min-width:66px;border-radius:19px;display:flex;flex-direction:column;
 align-items:center;justify-content:center;background:linear-gradient(145deg,#2a4a72,#1a2f4a);
 border:2px solid var(--gold);box-shadow:0 0 18px rgba(245,196,81,.18)}
.core b{font-size:31px;line-height:1;font-weight:700}
.core i{font-style:normal;font-size:9.5px;color:var(--gold);direction:ltr;margin-top:2px}
.nethd .meta b{font-size:15px;display:block}
.nethd .meta span{font-size:12px;color:var(--mut)}
.branch{display:grid;gap:8px}
@media(min-width:640px){.branch{grid-template-columns:1fr 1fr}}
@media(min-width:1040px){.branch{grid-template-columns:1fr 1fr 1fr}}
.br{background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:10px 12px;
 position:relative;transition:.15s}
.br.done{border-color:var(--green);background:rgba(62,201,138,.08)}
.br .w{font-size:21px;font-weight:700;direction:ltr;text-align:left;line-height:1.35}
.br .p{font-size:12px;color:var(--gold);direction:ltr;text-align:left}
.br .m{font-size:13px;margin-top:2px}
.br .s{margin-top:7px;padding-top:7px;border-top:1px dashed var(--line2)}
.br .s .sh{font-size:15px;direction:ltr;text-align:left;font-weight:600}
.br .s .sp{font-size:11.5px;color:var(--blue);direction:ltr;text-align:left}
.br .s .sa{font-size:12px;color:var(--mut)}

/* ── تمرين الثانيتين ── */
.qa{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:9px}
.qa.on{border-color:var(--gold)}
.qa .qq{font-size:19px;font-weight:700;direction:ltr;text-align:left;color:var(--gold)}
.qa .qm{font-size:13.5px;color:var(--mut);margin-top:2px}
.qa .aa{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line2)}
.qa .aa .av{font-size:18px;font-weight:700;direction:ltr;text-align:left;color:var(--green)}
.qa .aa .am{font-size:13.5px;margin-top:2px}
.hidden-a{margin-top:10px;padding:10px;border:1px dashed var(--line2);border-radius:11px;
 text-align:center;color:var(--mut);font-size:12.5px}
.timer{height:4px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:9px}
.timer i{display:block;height:100%;background:var(--red);width:100%;
 animation:tk 2s linear forwards;border-radius:99px}
@keyframes tk{to{width:0}}

/* ── بطاقات ── */
#fcWrap{min-height:54vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.fc{width:100%;max-width:440px;min-height:230px;background:linear-gradient(160deg,var(--card2),var(--card));
 border:1px solid var(--line2);border-radius:22px;display:flex;flex-direction:column;align-items:center;
 justify-content:center;padding:26px 20px;text-align:center;box-shadow:var(--shadow)}
.fc .big{font-size:50px;font-weight:700;direction:ltr;line-height:1.3}
.fc .mid{font-size:19px;color:var(--gold);direction:ltr;margin-top:8px}
.fc .low{font-size:19px;margin-top:14px;font-weight:600}
.fc .hint{font-size:12.5px;color:var(--mut);margin-top:14px}
.fcbtns{display:flex;gap:9px;width:100%;max-width:440px}
.fcbtns .btn{flex:1;justify-content:center;padding:13px;font-size:14px;border-radius:12px}

.lnk{display:flex;align-items:center;gap:10px;padding:11px 13px;background:var(--card);
 border:1px solid var(--line);border-radius:13px;margin-bottom:8px;text-decoration:none;color:inherit;transition:.15s}
.lnk:hover{border-color:var(--gold)}
.lnk .ic{font-size:21px}
.lnk .tx{flex:1;min-width:0}
.lnk .tx b{display:block;font-size:14px}
.lnk .tx span{font-size:12px;color:var(--mut)}
.lnk .go{color:var(--blue);font-size:12.5px;white-space:nowrap}

.dl{display:flex;gap:9px;margin-bottom:9px;align-items:flex-start}
.dl .who{font-size:11px;color:var(--mut);background:var(--card2);border:1px solid var(--line);
 border-radius:99px;padding:3px 9px;white-space:nowrap;margin-top:4px}
.dl.me .who{color:var(--gold);border-color:rgba(245,196,81,.4)}
.dl .bub{flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:9px 12px}
.dl.me .bub{background:rgba(245,196,81,.08);border-color:rgba(245,196,81,.28)}

textarea,input.f{width:100%;background:#0a1120;border:1px solid var(--line);border-radius:11px;
 color:var(--txt);padding:11px;font-size:14px;font-family:inherit;outline:none}
textarea:focus,input.f:focus{border-color:var(--gold)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.big-btn{background:var(--gold);color:#12233b;font-weight:800;border-radius:12px;padding:12px 18px;
 font-size:14px;flex:1;min-width:130px;text-align:center}
.big-btn.alt{background:var(--card2);color:var(--txt);border:1px solid var(--line2)}
.big-btn.danger{background:rgba(255,107,107,.15);color:var(--red);border:1px solid var(--red)}

table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--card2);color:var(--gold);font-size:12px;padding:8px 6px;text-align:center;border:1px solid var(--line)}
td{border:1px solid var(--line);padding:8px 6px;text-align:center;vertical-align:middle}
td.hz{font-size:19px;font-weight:700;direction:ltr}
td.py{font-size:11.5px;color:var(--gold);direction:ltr}
td.st{font-size:11.5px;color:var(--mut);text-align:right}

.toast{position:fixed;bottom:90px;right:50%;transform:translateX(50%) translateY(10px);
 background:var(--gold);color:#12233b;padding:11px 20px;border-radius:999px;font-weight:700;
 font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:80;box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translateX(50%) translateY(0)}
.empty{text-align:center;color:var(--mut);padding:44px 14px;font-size:14px}
.empty b{display:block;font-size:38px;margin-bottom:10px;opacity:.5}
.note{background:rgba(90,169,230,.09);border:1px solid rgba(90,169,230,.3);border-radius:12px;
 padding:11px 13px;font-size:12.5px;margin-bottom:12px;line-height:1.75}
.note b{color:var(--blue)}
.warn{background:rgba(245,196,81,.09);border-color:rgba(245,196,81,.32)}
.warn b{color:var(--gold)}
ul.g{margin:0;padding-right:19px;line-height:1.95;font-size:13.5px}
ul.g li b{color:var(--gold)}
.mono{direction:ltr;text-align:left;font-family:ui-monospace,Menlo,Consolas,monospace;
 font-size:11px;word-break:break-all;line-height:1.5}
.formula{background:linear-gradient(135deg,#1d3a5c,#152b45);border:1px solid var(--gold);
 border-radius:15px;padding:15px;text-align:center;margin-bottom:12px}
.formula b{display:block;font-size:15.5px;color:var(--gold);line-height:1.85}
.formula span{display:block;font-size:15px;margin-top:6px;direction:ltr}
.keycard{background:linear-gradient(150deg,#2a2044,#1a1730);border:1px solid var(--purple);
 border-radius:16px;padding:14px;margin-bottom:11px}
.keycard .kh{font-size:16px;font-weight:800;color:var(--pink);margin-bottom:5px}
.keycard .ks{font-size:13px;color:var(--txt);line-height:1.75;margin-bottom:10px;
 background:rgba(0,0,0,.24);border-radius:10px;padding:9px 11px}
.numchip{display:inline-flex;flex-direction:column;align-items:center;background:var(--card2);
 border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:0 4px 6px 0;min-width:76px}
.numchip b{font-size:19px;color:var(--gold)}
.numchip .n1{font-size:15px;direction:ltr}
.numchip .n2{font-size:11px;color:var(--mut)}

diǎn kāihuì?", "hz": "我们几点开会？", "en": "", "ar": "متى الاجتماع؟", "note": ""}, {"id": "bk_8", "role": "B", "py": "Shí diǎn kāihuì.", "hz": "十点开会。", "en": "", "ar": "الاجتماع الساعة العاشرة.", "note": ""}, {"id": "bk_9", "role": "A", "py": "Hǎo, bié chídào.", "hz": "好，别迟到。", "en": "", "ar": "حسناً، لا تتأخر.", "note": ""}]}, {"title": "📖 درس 7 — السؤال عن الطريق", "src": "واجب الكتاب", "lines": [{"id": "bk_10", "role": "A", "py": "Qǐngwèn, bàngōngshì zài nǎr?", "hz": "请问，办公室在哪儿？", "en": "", "ar": "عفواً، أين المكتب؟", "note": ""}, {"id": "bk_11", "role": "B", "py": "Yìzhí zǒu, ránhòu wǎng yòu guǎi.", "hz": "一直走，然后往右拐。", "en": "", "ar": "امشِ مستقيماً ثم انعطف يميناً.", "note": ""}, {"id": "bk_12", "role": "A", "py": "Yuǎn ma?", "hz": "远吗？", "en": "", "ar": "هل هو بعيد؟", "note": ""}, {"id": "bk_13", "role": "B", "py": "Bù yuǎn, hěn jìn.", "hz": "不远，很近。", "en": "", "ar": "ليس بعيداً، قريب جداً.", "note": ""}, {"id": "bk_14", "role": "A", "py": "Xièxie nǐ.", "hz": "谢谢你。", "en": "", "ar": "شكراً لك.", "note": ""}]}, {"title": "📖 درس 10 — في المطعم", "src": "واجب الكتاب", "lines": [{"id": "bk_15", "role": "A", "py": "Nǐ xiǎng chī shénme?", "hz": "你想吃什么？", "en": "", "ar": "ماذا تريد أن تأكل؟", "note": ""}, {"id": "bk_16", "role": "B", "py": "Wǒ yào yí gè miàn.", "hz": "我要一个面。", "en": "", "ar": "أريد طبق معكرونة (نودلز).", "note": ""}, {"id": "bk_17", "role": "A", "py": "Hē shénme?", "hz": "喝什么？", "en": "", "ar": "ماذا تشرب؟", "note": ""}, {"id": "bk_18", "role": "B", "py": "Wǒ yào yì bēi chá.", "hz": "我要一杯茶。", "en": "", "ar": "أريد كوب شاي.", "note": ""}, {"id": "bk_19", "role": "A", "py": "Hǎo, qǐng děng yíxià.", "hz": "好，请等一下。", "en": "", "ar": "حسناً، انتظر قليلاً.", "note": ""}]}, {"title": "📖 درس 13 — المكالمة الهاتفية", "src": "واجب الكتاب", "lines": [{"id": "bk_20", "role": "A", "py": "Wéi, nǐ hǎo, nǎ wèi?", "hz": "喂，你好，哪位？", "en": "", "ar": "ألو، مرحباً، من معي؟", "note": ""}, {"id": "bk_21", "role": "B", "py": "Wǒ shì Muhammad, jīnglǐ zài ma?", "hz": "我是穆罕默德，经理在吗？", "en": "", "ar": "أنا محمد، هل المدير موجود؟", "note": ""}, {"id": "bk_22", "role": "A", "py": "Tā bú zài, nǐ dǎ tā shǒujī ba.", "hz": "他不在，你打他手机吧。", "en": "", "ar": "ليس موجوداً، اتصل بتليفونه.", "note": ""}, {"id": "bk_23", "role": "B", "py": "Hǎo, xièxie.", "hz": "好，谢谢。", "en": "", "ar": "حسناً، شكراً.", "note": ""}, {"id": "bk_24", "role": "A", "py": "Bú kèqi.", "hz": "不客气。", "en": "", "ar": "العفو.", "note": ""}]}], "drill2s": [{"id": "q0", "q": "Nǐ hǎo ma?", "qa": "كيف حالك؟", "a": "Wǒ hěn hǎo, xièxie.", "aa": "بخير، شكراً.", "wk": "الأسبوع 1"}, {"id": "q1", "q": "Nǐ jiào shénme míngzi?", "qa": "ما اسمك؟", "a": "Wǒ jiào Muhammad.", "aa": "اسمي محمد.", "wk": "الأسبوع 1"}, {"id": "q2", "q": "Nǐ shì shéi?", "qa": "من أنت؟", "a": "Wǒ shì fānyì.", "aa": "أنا المترجم.", "wk": "الأسبوع 1"}, {"id": "q3", "q": "Nǐ qù nǎr?", "qa": "إلى أين تذهب؟", "a": "Wǒ qù zuānjǐng píngtái.", "aa": "أذهب إلى أرضية البرج.", "wk": "الأسبوع 1"}, {"id": "q4", "q": "Zhǔnbèi hǎo le ma?", "qa": "هل أنت جاهز؟", "a": "Zhǔnbèi hǎo le.", "aa": "جاهز.", "wk": "الأسبوع 1"}, {"id": "q5", "q": "Nǐ dǒng ma?", "qa": "هل فهمت؟", "a": "Dǒng le. / Wǒ tīng bù dǒng.", "aa": "فهمت. / لا أفهم.", "wk": "الأسبوع 1"}, {"id": "q6", "q": "Qǐng zài shuō yí biàn.", "qa": "أعد من فضلك.", "a": "Hǎo de, wǒ zài shuō yí biàn.", "aa": "حسناً، سأعيد.", "wk": "الأسبوع 2"}, {"id": "q7", "q": "Jīntiān yǒu duōshao gōngrén?", "qa": "كم عاملاً اليوم؟", "a": "Jīntiān yǒu èrshí gè gōngrén.", "aa": "اليوم عشرون عاملاً.", "wk": "الأسبوع 2"}, {"id": "q8", "q": "Nǐ huì shuō Hànyǔ ma?", "qa": "هل تتحدث الصينية؟", "a": "Wǒ huì shuō yìdiǎnr.", "aa": "أتحدث قليلاً.", "wk": "الأسبوع 2"}, {"id": "q9", "q": "Qǐng shuō màn yìdiǎnr.", "qa": "تكلم ببطء.", "a": "Hǎo, xièxie nín.", "aa": "حسناً، شكراً لك.", "wk": "الأسبوع 2"}, {"id": "q10", "q": "Zhè shì shénme?", "qa": "ما هذا؟", "a": "Zhè shì zuāntóu.", "aa": "هذا رأس الحفر.", "wk": "الأسبوع 2"}, {"id": "q11", "q": "Shèbèi zài nǎr?", "qa": "أين المعدات؟", "a": "Shèbèi zài cāngkù lǐ.", "aa": const KEY='mj_chinese_v2', DAY=864e5, SPACING=[1,3,7,14,30,60];
let S=load();
function load(){
  try{const o=JSON.parse(localStorage.getItem(KEY)); if(o&&o.v) return o;}catch(e){}
  try{ // ترقية من النسخة الأولى
    const o=JSON.parse(localStorage.getItem('mj_chinese_v1'));
    if(o&&o.v) return {v:2,learned:o.learned||{},tasks:o.tasks||{},bank:o.bank||[],
                       log:o.log||{},field:[],tab:'home',created:o.created||Date.now()};
  }catch(e){}
  return {v:2,learned:{},tasks:{},bank:[],log:{},field:[],tab:'home',created:Date.now()};
}
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('⚠️ ما كدر يحفظ')}},180);}

const today=()=>new Date().toISOString().slice(0,10);
const dnum =()=>Math.min(DATA.plan42.length,Math.max(1,
  Math.floor((Date.now()-new Date(DATA.start).getTime())/DAY)+1));
const todayPlan=()=>DATA.plan42.find(p=>p.d===dnum())||DATA.plan42[0];

const isLearned=id=>!!S.learned[id];
const due=id=>{const r=S.learned[id];return !!(r&&r.next&&r.next<=Date.now())};
function markLearned(id){const n=Date.now();
  if(S.learned[id])delete S.learned[id];else S.learned[id]={t:n,n:0,next:n+SPACING[0]*DAY};save();}
function reviewed(id,ok){const r=S.learned[id];if(!r)return;
  r.n=ok?Math.min(r.n+1,SPACING.length-1):0; r.next=Date.now()+SPACING[r.n]*DAY; save();}
const dueList=()=>ALL.filter(x=>due(x.id));
const learnedCount=()=>Object.keys(S.learned).length;

/* ══════════ النطق ══════════ */
let VOICE=null;
function pickVoice(){const v=speechSynthesis.getVoices();
  VOICE=v.find(x=>/zh[-_]CN/i.test(x.lang))||v.find(x=>/^zh/i.test(x.lang))||null;}
if('speechSynthesis' in window){try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}}
function say(t,rate){
  if(!('speechSynthesis' in window)){toast('المتصفح ما يدعم النطق');return}
  if(!t||!/[一-鿿]/.test(t)){toast('ماكو رموز صينية للنطق');return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(String(t).replace(/[／/·]/g,'，'));
  u.lang='zh-CN';u.rate=rate||.82;if(VOICE)u.voice=VOICE;speechSynthesis.speak(u);
}
let seqStop=false;
function sayAll(list){
  list=list.filter(x=>x&&/[一-鿿]/.test(x));
  if(!list.length){toast('ماكو شي للتشغيل');return}
  seqStop=false;let i=0;toast('▶️ '+list.length+' عنصر — اضغط إيقاف للإنهاء');
  (function nxt(){ if(seqStop||i>=list.length)return;
    const u=new SpeechSynthesisUtterance(list[i++].replace(/[／/·]/g,'，'));
    u.lang='zh-CN';u.rate=.78;if(VOICE)u.voice=VOICE;
    u.onend=()=>setTimeout(nxt,700); u.onerror=()=>setTimeout(nxt,400);
    speechSynthesis.speak(u);})();
}
function stopAll(){seqStop=true;try{speechSynthesis.cancel()}catch(e){}toast('⏹ توقّف')}

const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('on'),1500);}
const learnBtn=(id,lbl)=>`<button class="btn ${isLearned(id)?'ok':''}" data-learn="${id}">${isLearned(id)?'✅ محفوظة':(lbl||'☑️ حفظتها')}</button>`;
const sayBtn=(t,lbl)=>t?`<button class="btn play" data-say="${E(t)}">🔊 ${lbl||''}</button>`:'';

function itemCard(x,o={}){
  const on=isLearned(x.id),d=due(x.id);
  const ex=(x.shz||x.spy||x.sar)?`<div class="ex">
    ${x.shz?`<div class="exhz">${E(x.shz)}</div>`:''}
    ${x.spy?`<div class="expy">${E(x.spy)}</div>`:''}
    ${x.sar?`<div class="exar">${E(x.sar)}</div>`:''}
    ${x.sen?`<div class="exar" style="direction:ltr;text-align:left;font-size:11.5px">${E(x.sen)}</div>`:''}</div>`:'';
  return `<div class="item${on?' done':''}">
    ${d?'<div class="badge" style="color:var(--gold)">⏰ مراجعة اليوم</div>':(o.grp&&x.grp?`<div class="badge">${E(x.grp)}</div>`:'')}
    <div class="top"><div class="em">${x.em||'▫️'}</div><div style="flex:1;min-width:0">
      ${x.hz?`<div class="hz">${E(x.hz)}</div>`:''}
      ${x.py?`<div class="py">${E(x.py)}</div>`:''}
      <div class="ar">${E(x.ar)}</div>
      ${x.en?`<div class="en">${E(x.en)}</div>`:''}</div></div>
    ${ex}${x.note?`<div class="nt">${E(x.note)}</div>`:''}
    <div class="acts">${sayBtn(x.hz,'الكلمة')}${x.shz?sayBtn(x.shz,'الجملة')+
      `<button class="btn play" data-say="${E(x.shz)}" data-slow="1">🐢</button>`:''}
      ${learnBtn(x.id)}<button class="btn" data-copy="${E(x.shz||x.hz||x.ar)}">⧉</button></div></div>`;
}

function prog(t,c,n){const p=n?Math.round(c/n*100):0;return `<div style="margin-bottom:11px">

  <div class="gbar" style="margin:0"><i style="width:${p}%"></i></div></div>`}

/* ── بطاقات ── */
let fcPool=[],fcIdx=0,fcFlip=false,fcMode='hz2ar',fcSrc='all';
function fcBuild(){
  let p=ALL.filter(x=>x.hz&&/[一-鿿]/.test(x.hz));
  if(fcSrc==='due')p=p.filter(x=>due(x.id));
  else if(fcSrc==='new')p=p.filter(x=>!isLearned(x.id));
  else if(fcSrc==='learned')p=p.filter(x=>isLearned(x.id));
  else if(fcSrc!=='all')p=p.filter(x=>x.gk===fcSrc);
  fcPool=p.sort(()=>Math.random()-.5);fcIdx=0;fcFlip=false;
}
V.fc=()=>{
  if(!fcPool.length)fcBuild();
  const x=fcPool[fcIdx];
  const srcs=[['all','الكل'],['new','جديدة'],['due','مراجعة اليوم'],['learned','المحفوظة'],
              ['nets','الشبكات'],['vocab','المفردات'],['ladder','السُلّم'],['rescue','الإنقاذ']];
  const modes=[['hz2ar','汉字 ← عربي'],['ar2hz','عربي ← 汉字'],['py2hz','Pinyin ← 汉字']];
  const chips=`<div class="chips">${srcs.map(s=>`<button class="ch${fcSrc===s[0]?' on':''}" data-fcs="${s[0]}">${s[1]}</button>`).join('')}</div>
    <div class="chips">${modes.map(m=>`<button class="ch${fcMode===m[0]?' on':''}" data-fcm="${m[0]}">${m[1]}</button>`).join('')}</div>`;
  if(!x)return chips+`<div class="empty"><b>🗂</b>ماكو بطاقات بهذا الفلتر.</div>`;
  let f,b;
  if(fcMode==='ar2hz'){f=`<div class="low" style="font-size:26px">${E(x.ar)}</div>`;
    b=`<div class="big">${E(x.hz)}</div><div class="mid">${E(x.py)}</div>`}
  else if(fcMode==='py2hz'){f=`<div class="mid" style="font-size:27px">${E(x.py)}</div>`;
    b=`<div class="big">${E(x.hz)}</div><div class="low">${E(x.ar)}</div>`}
  else{f=`<div class="big">${E(x.hz)}</div>`;b=`<div class="mid">${E(x.py)}</div><div class="low">${E(x.ar)}</div>`}
  return chips+`<div id="fcWrap">
    <div style="font-size:12.5px;color:var(--mut)">${fcIdx+1} / ${fcPool.length} · ${E(x.grp||'')}</div>
    <div class="fc" id="fcCard">${f}${fcFlip?b:'<div class="hint">اضغط البطاقة لكشف الجواب · أو مسافة</div>'}</div>
    <div class="fcbtns">${sayBtn(x.hz,'نطق')}<button class="btn" id="fcNext">التالية ←</button></div>
    ${fcFlip?`<div class="fcbtns"><button class="btn ok" data-fcr="1">✅ عرفتها</button>
      <button class="btn" data-fcr="0" style="color:var(--red)">✕ ما عرفتها</button></div>`:''}</div>`;
};

  const term=$('#q').value.trim().toLowerCase();

  if(t=g('[data-tab]')){go(t.dataset.tab);return}
  if(t=g('[data-say]')){say(t.dataset.say,t.dataset.slow?.5:.82);return}
  if(t=g('[data-saynet]')){const n=DATA.nets[+t.dataset.saynet];
    sayAll(n.words.flatMap(w=>[w.hz,w.shz]));return}
  if(t=g('[data-sayvoc]')){const gr=DATA.vocab.find(x=>x.key===t.dataset.sayvoc);
    sayAll(gr.items.flatMap(i=>[i.hz,i.shz]));return}
  if(t=g('[data-saydlg]')){sayAll(DATA.dialogues[+t.dataset.saydlg].lines.map(l=>l.hz));return}
  if(t=g('[data-saylad]')){sayAll(DATA.ladder.filter(l=>l.grp===t.dataset.saylad).map(l=>l.hz));return}
  if(t=g('[data-copy]')){navigator.clipboard?.writeText(t.dataset.copy);toast('⧉ تم النسخ');return}
  if(t=g('[data-learn]')){markLearned(t.dataset.learn);render();
    toast(isLearned(t.dataset.learn)?'✅ انحفظت — تراجعها بكرة':'أُلغي الحفظ');return}
  if(t=g('[data-rev]')){reviewed(t.dataset.rev,t.dataset.ok==='1');render();
    toast(t.dataset.ok==='1'?'👍 تباعدت المراجعة':'↺ ترجع بكرة');return}
  if(t=g('[data-task]')){const k=t.dataset.task;
    if(S.tasks[k])delete S.tasks[k];else S.tasks[k]=1;save();render();return}
  if(t=g('[data-qs]')){qShow[t.dataset.qs]=!qShow[t.dataset.qs];render();return}
  if(t=g('[data-vf]')){vFilter=t.dataset.vf;render();return}
  if(t=g('[data-rf]')){rFilter=t.dataset.rf;render();return}
  if(t=g('[data-df]')){dSrc=t.dataset.df;render();return}
  if(t=g('[data-np]')){netPage=+t.dataset.np;render();window.scrollTo(0,0);return}
  if(t=g('[data-ex]')){exTab=t.dataset.ex;render();window.scrollTo(0,0);return}
  if(t=g('[data-mem]')){memTab=t.dataset.mem;render();window.scrollTo(0,0);return}
  if(t=g('[data-fcs]')){fcSrc=t.dataset.fcs;fcBuild();render();return}
  if(t=g('[data-fcm]')){fcMode=t.dataset.fcm;fcFlip=false;render();return}
  if(t=g('[data-fcr]')){const x=fcPool[fcIdx];
    if(!isLearned(x.id))markLearned(x.id);else reviewed(x.id,t.dataset.fcr==='1');
    fcIdx=(fcIdx+1)%fcPool.length;fcFlip=false;render();return}
  if(g('#fcCard')){fcFlip=!fcFlip;render();return}
  if(g('#fcNext')){fcIdx=(fcIdx+1)%fcPool.length;fcFlip=false;render();return}
  if(t=g('[data-del]')){S.bank=S.bank.filter(x=>x.id!==t.dataset.del);
    delete S.learned[t.dataset.del];save();rebuild();render();toast('🗑 انحذفت');return}
  if(g('#qAllShow')){DATA.drill2s.forEach(q=>qShow[q.id]=1);render();return}
  if(g('#qAllHide')){qShow={};render();return}
  if(g('#nbAdd')){const ar=$('#nbAr').value.trim();
    if(!ar){toast('اكتب المعنى بالعربي');return}
    S.bank.unshift({id:'sb_'+Date.now(),ar,hz:$('#nbHz').value.trim(),py:$('#nbPy').value.trim(),
      topic:$('#nbTp').value.trim()||'ميدان',date:today()});
    save();rebuild();render();toast('➕ انضافت');return}
  const dump=()=>btoa(unescape(encodeURIComponent(JSON.stringify(
    {learned:S.learned,tasks:S.tasks,bank:S.bank,log:S.log}))));
  if(g('#doExp')){$('#exp').value=dump();toast('🔑 الكود جاهز');return}
  if(g('#doCopy')){const v=$('#exp').value;if(!v){toast('ولّد الكود أولاً');return}
    navigator.clipboard?.writeText(v);toast('⧉ انتسخ — أرسله لنفسك');return}
  if(g('#doFile')){const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([$('#exp').value||dump()],{type:'text/plain'}));
    a.download='تقدمي_الصيني_'+today()+'.txt';a.click();toast('⬇️ انحفظ');return}
  if(g('#doImp')){try{
      const o=JSON.parse(decodeURIComponent(escape(atob($('#imp').value.trim()))));
      let n=0;
      for(const k in(o.learned||{})){if(!S.learned[k]||o.learned[k].t<S.learned[k].t){S.learned[k]=o.learned[k];n++}}
      Object.assign(S.tasks,o.tasks||{});Object.assign(S.log,o.log||{});
      const have=new Set(S.bank.map(x=>x.id));
      (o.bank||[]).forEach(x=>{if(!have.has(x.id))S.bank.push(x)});
      save();rebuild();render();toast('✅ اندمج — '+n+' عنصر');
    }catch(err){toast('❌ الكود مو صحيح')} return}
  if(g('#doReset')){if(confirm('متأكد؟ راح ينمسح كل التقدّم على هذا الجهاز.')){
    localStorage.removeItem(KEY);S=load();rebuild();render();toast('تم المسح')} return}
});
document.addEventListener('input',e=>{if(e.target.id==='q')render()});
document.addEventListener('keydown',e=>{
  if(S.tab!=='fc'||$('#q').value||/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(e.code==='Space'){e.preventDefault();fcFlip=!fcFlip;render()}
  if(e.key==='ArrowLeft'){fcIdx=(fcIdx+1)%fcPool.length;fcFlip=false;render()}
});
function rebuild(){
  for(let i=ALL.length-1;i>=0;i--)if(String(ALL[i].id).startsWith('sb_'))ALL.splice(i,1);
  S.bank.forEach(x=>ALL.push({...x,grp:'بنك الجمل',gk:'bank',em:'💬'}));
}
rebuild();render();

</script></body></html>
